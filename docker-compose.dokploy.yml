# Compose pour déploiement Dokploy
# Dans Dokploy : type Compose, Compose Path = ./docker-compose.dokploy.yml
# Domaine : configure-le dans l'UI Dokploy (Domains) OU via APP_DOMAIN ci-dessous.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # Port interne uniquement — Traefik (Dokploy) route vers 80
    expose:
      - "80"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.tantuni-grill.rule=Host(`${APP_DOMAIN:-tantuni.localhost}`)
      - traefik.http.routers.tantuni-grill.entrypoints=websecure
      - traefik.http.routers.tantuni-grill.tls.certResolver=letsencrypt
      - traefik.http.services.tantuni-grill.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true
