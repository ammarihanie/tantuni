# Dokploy — Compose Path: ./docker-compose.dokploy.yml
# Domaine : à configurer dans l'onglet Domains de Dokploy (pas de labels Traefik ici).
# Service à sélectionner pour le domaine : web · Port : 80

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
